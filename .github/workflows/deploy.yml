# main에 올라온 코드를 검사하고 배포 묶음(release)을 만든다.
# VM은 이 워크플로의 마지막 성공 빌드를 3분마다 확인해 가져간다(deploy/vm/mos_deploy.py).
# 이 워크플로에는 비밀 값이 하나도 필요 없다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 구성 확인
        id: layout
        run: |
          app=false; web=false; tests=false
          if [ -f mos/main.py ] && [ -f requirements.txt ]; then app=true; fi
          if [ -f web/package.json ] && [ -f web/package-lock.json ]; then web=true; fi
          if [ -d tests ]; then tests=true; fi
          {
            echo "app=$app"
            echo "web=$web"
            echo "tests=$tests"
          } >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------- 파이썬
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: 검사 도구 설치
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: 앱 패키지 설치(해시 고정)
        if: steps.layout.outputs.app == 'true'
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r requirements.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        if: steps.layout.outputs.tests == 'true'
        run: python -m pytest -q

      # ---------------------------------------------------- 웹
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.layout.outputs.web == 'true'
        with:
          node-version: "24"

      - name: 웹 빌드
        if: steps.layout.outputs.web == 'true'
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint --if-present
          npm test --if-present
          npm run build

      # ---------------------------------------------------- 배포 묶음
      - name: 배포 묶음 만들기
        if: steps.layout.outputs.app == 'true' && steps.layout.outputs.web == 'true'
        run: |
          rm -rf out && mkdir -p out/pkg/app out/pkg/web
          cp -r mos requirements.txt out/pkg/app/
          cp -r web/dist/. out/pkg/web/
          find out/pkg -name '__pycache__' -type d -prune -exec rm -rf {} +
          printf '%s\n' "$GITHUB_SHA" > out/pkg/VERSION
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf out/release.tgz -C out/pkg .
          (cd out && sha256sum release.tgz > release.sha256)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.layout.outputs.app == 'true' && steps.layout.outputs.web == 'true'
        with:
          name: release
          path: |
            out/release.tgz
            out/release.sha256
          retention-days: 14
          if-no-files-found: error
