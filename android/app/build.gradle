plugins {
    id "com.android.application"
}

android {
    namespace "com.teamsheetnote.mos.todo"
    compileSdk 35

    defaultConfig {
        applicationId "com.teamsheetnote.mos.todo"
        minSdk 26
        targetSdk 35
        // 빌드마다 올라가는 번호(GitHub Actions 실행 번호). 덮어 설치할 때 새 버전으로 알아본다
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // 서명 열쇠는 GitHub 비밀 값으로만(없으면 디버그 서명). 같은 열쇠여야 새 버전을 덮어 설치할 수 있다
    signingConfigs {
        release {
            def keystore = System.getenv("MOS_ANDROID_KEYSTORE")
            if (keystore != null && !keystore.isEmpty()) {
                storeFile file(keystore)
                storePassword System.getenv("MOS_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MOS_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("MOS_ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 'signingConfig (조건) ? a : b'로 쓰면 Groovy가 signingConfig(조건)을 먼저 불러 설정 단계에서
            // 실패한다(불린을 서명 설정으로 바꿀 수 없음). 그래서 값을 먼저 고르고 '='로 넣는다
            def keystore = System.getenv("MOS_ANDROID_KEYSTORE")
            def useRelease = keystore != null && !keystore.isEmpty()
            signingConfig = useRelease ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.security:security-crypto:1.0.0"
}
