[project]
name = "mos"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W 형식, F 오류, I import 순서, N 이름 규칙, B 버그 위험, S 보안, UP 최신 문법
select = ["E", "W", "F", "I", "N", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # 테스트의 assert 허용

[tool.pytest.ini_options]
testpaths = ["tests"]
